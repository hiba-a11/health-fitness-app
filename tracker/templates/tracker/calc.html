{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mealth Calculators </title>
        <link rel="stylesheet" href="{%static 'css/style.css' %} ?v=3">

        <link href="https://fonts.googleapis.com/css2?family=Meie+Script&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">

    </head>
<body>

<!-- HEADER -->
 <header class="header">
     <div class="logo">
        <img src="{% static 'images/CB.png' %}" alt="CB Health & Wellness Logo">
    </div>
    <nav class="nav-links" aria-label="Main Navigation">
        <ul>
            <li><a href="/" aria-label="Wellness">Wellness</a></li>
            <li><a href="/" aria-label="Fitness">Fitness</a></li>
            <li><a href="/" aria-label="About Us">About Us</a></li>
            <li><a href="/" aria-label="Health">Health</a></li>
        </ul>
    </nav>

 </header>

 <!-- title-->
  <section class="calc-hero">
    <h1>Health calculators</h1>
    <p>Understand your body with clarity, not pressure</p>

  </section>

  <!--CALCULATORS-->
  <section class="calculaotor-section">
    <div class="calc-grid">

        <!--bmi-->
        <div class="calc-card">
            <h3>BMI</h3>
            <input type="number" id="bmi-height" placeholder="height (cm)">
            <input type="number" id="bmi-weight" placeholder="weight (kg)">
            <button onclick="calculateBMI()">Reveal your results</button>
            <p id="bmi-results"></p>
        </div>

        <!--calories-->
        <div class="calc-card">
            <h3>Calories needs</h3>
            <input type="number" id="age" placeholder="Age">
            <input type="number" id="weight" placeholder="weight (kg)">
            <input type="number" id="height" placeholder="height (cm)">
            <button onclick="calculateIdealWeight()"> Find your range </button>
            <p id="ideal-result"></p>

        </div>



    </div>
  </section>

  <!--js-->
  <script>
    function calculateBMI() {
        let h = document.getElementById("bmi-height").Value / 100;
        let w = document.getElementById("bmi-weight").Value /100;
        let bmi = w / (h * h);
        document.getElementById("bmi-result").innerText = 
            "BMI: " + bmi.toFixed(1); 
    }

    function calculateBMR () {
        let age = document.getElementById("age").Value;
        let weight = document.getElementById("weight").Value;
        let height = document.getElementById("height").Value;

        let bmr = 10 * weight + 6.25 * height - 5 * age - 161;

        document.getElementById("bmr-result").innerText = "Calories: " + Math.round(bmr);
    
    }

    function calculateIdealWeight() {
        let min = 18.5 * (height/100) * (height/100);
        let max = 24.8 * (height/100) * (height/100);

        document.getElementById("ideal-result").innerText = "Range: " + Math.round(min) + "kg - " + Math.round(max) + "kg"; 
    }


  </script>

</body>

</html>
